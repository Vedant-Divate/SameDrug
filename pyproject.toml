[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samedrug"
version = "0.1.0"
description = "Drug price transparency: NPPA ceiling prices vs Jan Aushadhi equivalents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "rapidfuzz>=3.9",
  "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["samedrug"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
